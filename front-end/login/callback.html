<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticação - Gestor Financeiro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f8fafc;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .loader { text-align: center; padding: 2rem; }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #e2e8f0;
      border-top-color: #3b82f6; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #64748b; font-size: 1rem; }
    .error { color: #ef4444; }
    .error a { color: #3b82f6; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="loader" id="status">
    <div class="spinner"></div>
    <p>Autenticando...</p>
  </div>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const error = params.get('error');

      if (window.opener) {
        if (token) {
          window.opener.postMessage({ token: token }, '*');
          window.close();
        } else {
          window.opener.postMessage({ error: error || 'auth_failed' }, '*');
          window.close();
        }
      } else {
        var el = document.getElementById('status');
        if (token) {
          localStorage.setItem('token', token);
          window.location.href = '../index.html';
        } else {
          el.innerHTML = '<p class="error">Falha na autentica\u00e7\u00e3o.</p><p style="margin-top:1rem"><a href="login.html">Tentar novamente</a></p>';
        }
      }
    })();
  </script>
</body>
</html>
