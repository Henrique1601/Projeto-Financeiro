<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Gestor Financeiro</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  
  <!-- CSS -->
  <link rel="stylesheet" href="../css/Login.css">
</head>
<body>
  <main class="Main_container">
    <section class="Container">
      <h1 class="messageDiv"></h1>
      
      <header class="Header_container">
        <h1><i class="fas fa-wallet"></i> Gestor Financeiro</h1>
      </header>
      
      <!-- Formulário de Login -->
      <form id="login-form">
        <label for="Email"><i class="fas fa-envelope"></i> Email</label>
        <input type="email" id="Email" placeholder="seu@email.com" required autocomplete="email">
        
        <label for="Senha"><i class="fas fa-lock"></i> Senha</label>
        <input type="password" id="Senha" placeholder="••••••••" required autocomplete="current-password">
        
        <button type="button" id="Btn-Login">
          <i class="fas fa-sign-in-alt"></i> Entrar
        </button>
        
        <ul>
          <li>
            <button type="button" id="show-forgot">Esqueceu a senha?</button>
          </li>
          <li>
            <p>Não tem conta?</p>
            <button type="button" id="show-register">Criar Conta</button>
          </li>
        </ul>
      </form>

      <!-- Formulário de Registro -->
      <form id="register-form" style="display: none;">
        <div class="header-register">
          <h2><i class="fas fa-user-plus"></i> Criar Conta</h2>
        </div>
        
        <label for="register-FNome"><i class="fas fa-user"></i> Nome</label>
        <input type="text" id="register-FNome" placeholder="Seu nome" required>
        
        <label for="register-SNome"><i class="fas fa-user"></i> Sobrenome</label>
        <input type="text" id="register-SNome" placeholder="Seu sobrenome" required>
        
        <label for="register-Email"><i class="fas fa-envelope"></i> Email</label>
        <input type="email" id="register-Email" placeholder="seu@email.com" required>
        
        <label for="register-Senha"><i class="fas fa-lock"></i> Senha</label>
        <input type="password" id="register-Senha" placeholder="••••••••" required>
        
        <button type="button" id="Btn-Register">
          <i class="fas fa-user-plus"></i> Cadastrar
        </button>
        
        <ul>
          <li>
            <p>Já tem conta?</p>
            <button type="button" id="show-login">Fazer Login</button>
          </li>
        </ul>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="./register.js"></script>
  <script src="./login.js"></script>
</body>
</html>
