<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci a Senha - Gestor Financeiro</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <link rel="stylesheet" href="../css/Login.css">
  <link rel="stylesheet" href="./esqueci.css">
</head>
<body>
  <main class="Main_container">
    <section class="Container">
      <header class="Header_container">
        <h1><i class="fas fa-key"></i> Recuperar Senha</h1>
      </header>
      
      <form id="forgot-form" class="active">
        <p class="forgot-info">
          Digite seu email para receber um código de recuperação.
        </p>
        
        <label for="forgot-email"><i class="fas fa-envelope"></i> Email</label>
        <input type="email" id="forgot-email" placeholder="seu@email.com" required>
        
        <button type="button" id="btn-forgot" class="btn">
          <i class="fas fa-paper-plane"></i> Enviar Código
        </button>
        
        <ul>
          <li>
            <p>Lembrou a senha?</p>
            <button type="button" onclick="window.location.href='./login.html'">Voltar ao Login</button>
          </li>
        </ul>
      </form>

      <form id="reset-form">
        <p class="forgot-info">
          Digite o código de recuperação e sua nova senha.
        </p>
        
        <label for="reset-email"><i class="fas fa-envelope"></i> Email</label>
        <input type="email" id="reset-email" placeholder="seu@email.com" required>
        
        <label for="reset-code"><i class="fas fa-key"></i> Código de Recuperação</label>
        <input type="text" id="reset-code" class="code-input" placeholder="000000" required maxlength="6">
        
        <label for="reset-senha"><i class="fas fa-lock"></i> Nova Senha</label>
        <input type="password" id="reset-senha" placeholder="••••••••" required>
        
        <label for="reset-senha2"><i class="fas fa-lock"></i> Confirmar Senha</label>
        <input type="password" id="reset-senha2" placeholder="••••••••" required>
        
        <button type="button" id="btn-reset" class="btn">
          <i class="fas fa-check"></i> Redefinir Senha
        </button>
        
        <ul>
          <li>
            <p>Não recebeu o código?</p>
            <button type="button" id="btn-resend">Enviar Novamente</button>
          </li>
          <li>
            <p>Lembrou a senha?</p>
            <button type="button" onclick="window.location.href='./login.html'">Voltar ao Login</button>
          </li>
        </ul>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="./esqueci.js"></script>
</body>
</html>
